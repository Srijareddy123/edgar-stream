# Memory is kept small on purpose: Redpanda 512 MB, MinIO about 150 MB, Airflow about 1.5 GB.
name: edgar-stream
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.11
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e  # release 2025-09-07
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9100:9000", "9101:9001"]
    mem_limit: 400m
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    profiles: ["airflow"]
    build: { context: ., dockerfile: Dockerfile.airflow }
    command: standalone
    ports: ["8090:8080"]
    mem_limit: 2g
    depends_on:
      redpanda: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "10"
      EDGAR_BIN: /opt/airflow/edgar-venv/bin/edgar-stream
      EDGAR_HOME: /opt/edgar
      DAYS_DIR: /opt/edgar/sample/days
      KAFKA_BOOTSTRAP: redpanda:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: edgar-raw
      EDGAR_MODE: replay
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./sample:/opt/edgar/sample:ro
      - ./data:/opt/edgar/data
      - ./site:/opt/edgar/site

volumes:
  minio-data:
